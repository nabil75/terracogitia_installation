# Terra-Cogitia Front-End - SPA server (inside Cogitia-FrontEnd).
server {
    listen 8200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Runtime configuration: must never be cached.
    location = /assets/env.js {
        add_header Cache-Control "no-store";
    }

    # Content-hashed bundles (main-XXXXXXXX.js, styles-XXXXXXXX.css).
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
